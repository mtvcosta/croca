
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pré-venda</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f1e9;
      color: #202020;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main { padding: 30px; }
    h1 { font-size: 42px; }
    button {
      padding: 16px 28px;
      border: 0;
      border-radius: 30px;
      background: #202020;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #resposta { margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <p>UMA COISA ESTÁ CHEGANDO...</p>
    <h1>PRÉ-VENDA</h1>
    <p>Você ainda não está preparado.</p>
    <button onclick="brincar()">Descobrir mais</button>
    <p id="resposta"></p>
  </main>

  <script>
    function brincar() {
      document.getElementById("resposta").innerText =
        "Calma. Ainda estamos preparando tudo. 👀";
    }
  </script>
</body>
</html>
